server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Self-host has no CDN in front of it — without this the ~4MB entry bundle
    # ships uncompressed over the tunnel on every load.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml font/woff2;

    # .mjs files need application/javascript — not in nginx default mime.types
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vite content-hashes every filename under /assets/, so a new build always
    # gets a new URL — safe to cache forever instead of re-validating on every
    # reload.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy /api/* to the scene store — strip the /api prefix, same convention
    # as odyssey's web container.
    location /api/ {
        proxy_pass http://api:8100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Scenes with many elements serialize large; pasted images larger still.
        client_max_body_size 100m;
    }

    # Excalidraw routes on the hash, but keep the SPA fallback so a stray path
    # (or the PWA share target) still lands on the app rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
